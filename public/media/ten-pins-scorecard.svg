<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="860" height="130">
  <defs>
    <style>
      .lbl  { font: 11px sans-serif; fill: #666; }
      .roll { font: bold 15px monospace; fill: #222; }
      .x    { font: bold 15px monospace; fill: #b00; }
      .sp   { font: bold 15px monospace; fill: #036; }
      .cum  { font: bold 19px sans-serif; fill: #111; }
      .title{ font: 13px sans-serif; fill: #444; }
    </style>
  </defs>

  <!-- Title -->
  <text x="430" y="14" text-anchor="middle" class="title">Ten-Pin Bowling — Sample Game (Score: 110)</text>

  <!-- Background -->
  <rect x="0" y="20" width="850" height="110" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Horizontal line: roll row / score row (y=20+35=55) -->
  <line x1="0" y1="55" x2="850" y2="55" stroke="#aaa" stroke-width="1"/>

  <!-- Vertical main dividers between frames -->
  <!-- Frames 1-9 are 80px wide, frame 10 is 130px: 9×80 + 130 = 850 -->
  <line x1="80"  y1="20" x2="80"  y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="160" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="240" y1="20" x2="240" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="320" y1="20" x2="320" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="20" x2="400" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="480" y1="20" x2="480" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="20" x2="560" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="640" y1="20" x2="640" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="720" y1="20" x2="720" y2="130" stroke="#333" stroke-width="1.5"/>

  <!-- Roll sub-dividers (each 80px frame split in half at +40; frame 10 split in thirds at +43 and +87) -->
  <line x1="40"  y1="20" x2="40"  y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="120" y1="20" x2="120" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="200" y1="20" x2="200" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="280" y1="20" x2="280" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="360" y1="20" x2="360" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="20" x2="440" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="520" y1="20" x2="520" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="600" y1="20" x2="600" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="680" y1="20" x2="680" y2="55" stroke="#ccc" stroke-width="1"/>
  <!-- Frame 10: three roll boxes (43px, 43px, 44px) -->
  <line x1="763" y1="20" x2="763" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="806" y1="20" x2="806" y2="55" stroke="#ccc" stroke-width="1"/>

  <!-- ── Roll scores ── (centered in each sub-box; roll row y=20–55, midpoint y=40) -->
  <!-- F1: 7, 2 -->
  <text x="20"  y="42" text-anchor="middle" class="roll">7</text>
  <text x="60"  y="42" text-anchor="middle" class="roll">2</text>
  <!-- F2: 6, 1 -->
  <text x="100" y="42" text-anchor="middle" class="roll">6</text>
  <text x="140" y="42" text-anchor="middle" class="roll">1</text>
  <!-- F3: 5, / -->
  <text x="180" y="42" text-anchor="middle" class="roll">5</text>
  <text x="220" y="42" text-anchor="middle" class="sp">/</text>
  <!-- F4: 3, 4 -->
  <text x="260" y="42" text-anchor="middle" class="roll">3</text>
  <text x="300" y="42" text-anchor="middle" class="roll">4</text>
  <!-- F5: 5, / -->
  <text x="340" y="42" text-anchor="middle" class="roll">5</text>
  <text x="380" y="42" text-anchor="middle" class="sp">/</text>
  <!-- F6: X (strike — shown in right sub-box) -->
  <text x="460" y="42" text-anchor="middle" class="x">X</text>
  <!-- F7: 5, 3 -->
  <text x="500" y="42" text-anchor="middle" class="roll">5</text>
  <text x="540" y="42" text-anchor="middle" class="roll">3</text>
  <!-- F8: 5, − -->
  <text x="580" y="42" text-anchor="middle" class="roll">5</text>
  <text x="620" y="42" text-anchor="middle" class="roll">−</text>
  <!-- F9: 6, 2 -->
  <text x="660" y="42" text-anchor="middle" class="roll">6</text>
  <text x="700" y="42" text-anchor="middle" class="roll">2</text>
  <!-- F10: 7, /, 5 -->
  <text x="741" y="42" text-anchor="middle" class="roll">7</text>
  <text x="784" y="42" text-anchor="middle" class="sp">/</text>
  <text x="828" y="42" text-anchor="middle" class="roll">5</text>

  <!-- ── Cumulative scores ── (centered in score area y=55–130, midpoint y=97) -->
  <text x="40"  y="98" text-anchor="middle" class="cum">9</text>
  <text x="120" y="98" text-anchor="middle" class="cum">16</text>
  <text x="200" y="98" text-anchor="middle" class="cum">29</text>
  <text x="280" y="98" text-anchor="middle" class="cum">36</text>
  <text x="360" y="98" text-anchor="middle" class="cum">56</text>
  <text x="440" y="98" text-anchor="middle" class="cum">74</text>
  <text x="520" y="98" text-anchor="middle" class="cum">82</text>
  <text x="600" y="98" text-anchor="middle" class="cum">87</text>
  <text x="680" y="98" text-anchor="middle" class="cum">95</text>
  <text x="785" y="98" text-anchor="middle" class="cum">110</text>

  <!-- Frame number labels (small, bottom-left of each score cell) -->
  <text x="4"   y="128" class="lbl">1</text>
  <text x="84"  y="128" class="lbl">2</text>
  <text x="164" y="128" class="lbl">3</text>
  <text x="244" y="128" class="lbl">4</text>
  <text x="324" y="128" class="lbl">5</text>
  <text x="404" y="128" class="lbl">6</text>
  <text x="484" y="128" class="lbl">7</text>
  <text x="564" y="128" class="lbl">8</text>
  <text x="644" y="128" class="lbl">9</text>
  <text x="724" y="128" class="lbl">10</text>
</svg>
